<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title">SAM | 番剧手账</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans', 'Courier New', sans-serif;
      background: #0e0b1a;
      color: #e0d8f0;
      min-height: 100vh;
      overflow-x: hidden
    }

    ::selection {
      background: #ff6eb488;
      color: #fff
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 20% 30%, rgba(200, 100, 255, 0.04) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(100, 200, 255, 0.04) 0%, transparent 50%), repeating-linear-gradient(45deg, rgba(255, 200, 255, 0.008) 0px, rgba(255, 200, 255, 0.008) 2px, transparent 2px, transparent 8px);
      pointer-events: none;
      z-index: 0
    }

    ::-webkit-scrollbar {
      width: 5px
    }

    ::-webkit-scrollbar-track {
      background: #0e0b1a
    }

    ::-webkit-scrollbar-thumb {
      background: #ff6eb433;
      border-radius: 3px
    }

    .sakura-cont {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden
    }

    .petal {
      position: absolute;
      top: -20px;
      width: 8px;
      height: 8px;
      background: rgba(255, 180, 220, 0.15);
      border-radius: 50% 0 50% 0;
      animation: fall linear infinite
    }

    @keyframes fall {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 0
      }

      10% {
        opacity: 1
      }

      90% {
        opacity: 0.6
      }

      100% {
        transform: translateY(calc(100vh + 20px)) rotate(720deg);
        opacity: 0
      }
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0e0b1a;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-direction: column;
      transition: opacity 0.6s
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none
    }

    #splash .sp-text {
      font-size: 1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ff6eb4;
      text-shadow: 0 0 15px rgba(255, 110, 180, 0.3);
      animation: pulse 2s infinite
    }

    #splash .sp-sub {
      font-size: 0.6rem;
      letter-spacing: 4px;
      color: rgba(255, 200, 255, 0.2);
      margin-top: 14px;
      text-transform: uppercase
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    #page-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none
    }

    #page-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.12
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 24px 60px
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 20px;
      border-bottom: 1px solid rgba(255, 110, 180, 0.1);
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 10px
    }

    .header .logo {
      font-size: 1rem;
      letter-spacing: 2px;
      color: rgba(255, 200, 255, 0.6);
      font-weight: 400
    }

    .header .logo .jp {
      font-size: 0.7rem;
      color: rgba(255, 110, 180, 0.4);
      display: block
    }

    .header .back-link {
      color: rgba(255, 200, 255, 0.4);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
      transition: color 0.3s
    }

    .header .back-link:hover {
      color: #ff6eb4
    }

    .hero {
      text-align: center;
      padding: 30px 0 40px
    }

    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #ff6eb4, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }

    .hero .sub {
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      color: rgba(255, 200, 255, 0.7);
      letter-spacing: 4px;
      margin-top: 10px
    }

    .hero .desc {
      font-size: clamp(0.75rem, 1.1vw, 0.85rem);
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 2px;
      margin-top: 14px
    }

    .st {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: rgba(255, 110, 180, 0.7);
      margin: 40px 0 20px;
      font-weight: 400;
    }

    .st span {
      color: #c084fc99
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin: 20px 0 40px
    }

    .anime-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 110, 180, 0.08);
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block
    }

    .anime-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 110, 180, 0.35);
      box-shadow: 0 12px 40px rgba(255, 110, 180, 0.15), 0 0 60px rgba(192, 132, 252, 0.08)
    }

    .anime-card .card-img {
      width: 100%;
      height: 220px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #1a1030, #0e0b1a)
    }

    .anime-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
      opacity: 0.85
    }

    .anime-card:hover .card-img img {
      transform: scale(1.05);
      opacity: 1
    }

    .anime-card .card-img .year-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 2px;
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: #ff6eb4;
      border: 1px solid rgba(255, 110, 180, 0.15)
    }

    .anime-card .card-img .rating {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 1px
    }

    .anime-card .card-img .wiki-badge {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 0.6rem;
      color: rgba(255, 200, 255, 0.3);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 1px;
      backdrop-filter: blur(2px)
    }

    .anime-card:hover .card-img .wiki-badge {
      color: #ff6eb4
    }

    .anime-card .card-body {
      padding: 16px 18px 18px
    }

    .anime-card .card-body .jp-title {
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: rgba(255, 200, 255, 0.2);
      margin-bottom: 2px
    }

    .anime-card .card-body .cn-title {
      font-size: 1rem;
      font-weight: 600;
      color: #d0c8e0;
      margin-bottom: 4px
    }

    .anime-card .card-body .en-title {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 8px
    }

    .anime-card .card-body .desc {
      font-size: 0.75rem;
      color: rgba(255, 200, 255, 0.55);
      line-height: 1.6
    }

    .anime-card .card-body .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px
    }

    .anime-card .card-body .tags span {
      font-size: 0.6rem;
      padding: 2px 8px;
      border: 1px solid rgba(255, 110, 180, 0.1);
      border-radius: 2px;
      color: rgba(255, 110, 180, 0.4);
      background: rgba(255, 110, 180, 0.03)
    }

    .anime-card .card-body .quote {
      font-size: 0.7rem;
      color: rgba(255, 200, 255, 0.35);
      font-style: italic;
      margin-top: 8px;
      letter-spacing: 0.3px;
      border-left: 2px solid rgba(255, 110, 180, 0.1);
      padding-left: 10px
    }

    .music-player {
      margin: 50px 0 30px;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 110, 180, 0.06);
      border-radius: 3px;
      padding: 20px 24px
    }

    .music-player .mp-title {
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: rgba(255, 200, 255, 0.3);
      text-transform: uppercase;
      margin-bottom: 12px
    }

    .mp-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap
    }

    .mp-btn {
      background: rgba(255, 110, 180, 0.06);
      border: 1px solid rgba(255, 110, 180, 0.12);
      color: #ff6eb4cc;
      padding: 8px 20px;
      border-radius: 2px;
      font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans', 'Courier New', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none
    }

    .mp-btn:hover {
      background: rgba(255, 110, 180, 0.1)
    }

    .mp-btn.active {
      background: rgba(192, 132, 252, 0.1);
      border-color: #c084fc44;
      color: #c084fc
    }

    .lang-btn {
      background: rgba(255, 110, 180, 0.06);
      border: 1px solid rgba(255, 110, 180, 0.15);
      color: #ff6eb488;
      padding: 4px 12px;
      border-radius: 2px;
      font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans', 'Courier New', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s
    }

    .lang-btn:hover {
      background: rgba(255, 110, 180, 0.12);
      color: #ff6eb4
    }

    .mp-status {
      font-size: 0.65rem;
      color: rgba(255, 200, 255, 0.3);
      letter-spacing: 2px;
      min-width: 70px
    }

    .mp-time {
      font-size: 0.6rem;
      color: rgba(255, 200, 255, 0.25);
      font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans', 'Courier New', sans-serif;
      letter-spacing: 1px;
      min-width: 90px;
      text-align: center
    }

    input[type=range].seek-bar {
      width: 100%;
      margin: 8px 0;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 110, 180, 0.08);
      outline: none;
      border-radius: 2px;
      cursor: pointer
    }

    input[type=range].seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff6eb4;
      cursor: pointer;
      border: 1px solid rgba(255, 110, 180, 0.3)
    }

    .watch-order {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1px;
      line-height: 2.2;
      margin: 10px 0 20px
    }

    .watch-order ol {
      padding-left: 20px
    }

    .watch-order li {
      margin-bottom: 4px
    }

    footer {
      margin-top: 50px;
      padding: 20px 0;
      text-align: center;
      border-top: 1px solid rgba(255, 110, 180, 0.1);
      font-size: 0.65rem;
      color: rgba(255, 200, 255, 0.4);
      letter-spacing: 1px
    }

    footer a {
      color: rgba(255, 110, 180, 0.3);
      text-decoration: none;
      margin: 0 8px;
      transition: color 0.3s
    }

    footer a:hover {
      color: #ff6eb4
    }

    @media(max-width:640px) {
      .anime-grid {
        grid-template-columns: 1fr
      }

      .header {
        flex-direction: column;
        gap: 6px
      }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="sp-text">&#9733; ANIME</div>

  </div>
  <div id="sakura" class="sakura-cont"></div>
  <div id="page-bg"><img src="anime.jpg" alt=""></div>
  <div class="container">
    <div class="header">
      <div>
        <div class="logo"><span data-i18n="logo_text">ANIME</span>
          <div class="jp">— アニメ手帳 —</div>
        </div>

      <div style="display:flex;gap:16px;align-items:center">

        <button class="lang-btn" id="langToggle">EN</button>
      </div>
    </div>

    <div class="hero">
      <h1 data-i18n="hero_title">番剧手账</h1>

      <div class="desc" data-i18n="hero_desc">那些在深夜触动过我的故事</div>

    <h2 class="st"><span>&#9670;</span> <span data-i18n="sec_collection">作品收藏</span></h2>

            data-i18n="wo_opm">— ONE · 村田雄介</span></li>

      </ol>
    </div>

    <div class="music-player">
      <div class="mp-title" id="mp-title">&#9835; LiSA — crossing field</div>
      <div class="mp-controls">
        <button class="mp-btn" id="mp-song0">&#9654; LiSA — crossing field</button>
        <button class="mp-btn" id="mp-song1">MYTH &amp; ROID — STYX HELIX</button>
      </div>
      <div class="mp-controls" style="margin-top:10px">
        <button class="mp-btn" id="mp-play">&#9654;</button>
        <span class="mp-time" id="mp-time">00:00 / 00:00</span>
        <button class="mp-btn" id="mp-loop">&#128260;</button>
        <span class="mp-status" id="mp-status" data-i18n="mp_ready">&#9632; 就绪</span>
      </div>
      <input type="range" class="seek-bar" id="mp-seek" value="0" max="100">
    </div>
    <footer>
      <p><span data-i18n="footer_text">SAM &middot; 番剧手账</span> &middot; 2026</p>
      <p style="margin-top:4px"><a href="index.html">Home</a><a href="about.html">About</a><a
          href="games.html">Games</a></p>
    </footer>
  </div>
  <script>
    // Splash to autoplay
    (function () { var splash = document.getElementById("splash"); var audio = new Audio(); audio.preload = "auto"; audio.volume = 0.35; audio.loop = true; var p = window.location.href.lastIndexOf("/"); var base = window.location.href.substring(0, p + 1); var songs = [{ n: "LiSA - crossing field.mp3", t: "LiSA — crossing field" }, { n: "MYTH & ROID - STYX HELIX.mp3", t: "MYTH & ROID — STYX HELIX" }]; var currentSong = 0; function loadSong(idx) { audio.pause(); audio.src = base + songs[idx].n; audio.load(); currentSong = idx; document.getElementById("mp-title").textContent = "\u266B " + songs[idx].t; document.querySelectorAll("[id^=mp-song]").forEach(function (b) { b.classList.remove("active") }); document.getElementById("mp-song" + idx).classList.add("active"); var t = document.getElementById("mp-time"); t.textContent = "00:00 / 00:00"; document.getElementById("mp-seek").value = 0 } document.getElementById("mp-song0").addEventListener("click", function () { loadSong(0); if (isPlaying) { audio.play() } }); document.getElementById("mp-song1").addEventListener("click", function () { loadSong(1); if (isPlaying) { audio.play() } }); splash.addEventListener("click", async function () { splash.classList.add("hide"); loadSong(0); try { await audio.play() } catch (e) { } initPlayer() }); var isPlaying = false, isLoop = true, seeking = false; function initPlayer() { var btn = document.getElementById("mp-play"), loopBtn = document.getElementById("mp-loop"); var st = document.getElementById("mp-status"), tm = document.getElementById("mp-time"), seek = document.getElementById("mp-seek"); isPlaying = true; btn.textContent = "\u23F8"; btn.classList.add("active"); st.textContent = "\u266B"; loopBtn.classList.add("active"); function gLoopText() { var l = localStorage.getItem("sam_lang") || "zh"; return l === "zh" ? "\uD83D\uDD01 循环中" : "\uD83D\uDD01 Looping" } function gLoopOffText() { var l = localStorage.getItem("sam_lang") || "zh"; return l === "zh" ? "\uD83D\uDD01 循环" : "\uD83D\uDD01 Loop" } loopBtn.textContent = gLoopText(); audio.loop = true; function fmt(t) { var m = Math.floor(t / 60), s = Math.floor(t % 60); return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") } function ut() { if (audio.duration && isPlaying && !seeking) { seek.value = (audio.currentTime / audio.duration) * 100; tm.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration) } requestAnimationFrame(ut) } requestAnimationFrame(ut); btn.addEventListener("click", function () { if (isPlaying) { audio.pause(); isPlaying = false; btn.textContent = "\u25B6"; btn.classList.remove("active"); st.textContent = "\u25A0" } else { audio.play(); isPlaying = true; btn.textContent = "\u23F8"; btn.classList.add("active"); st.textContent = "\u266B" } requestAnimationFrame(ut) }); seek.addEventListener("input", function () { seeking = true; if (audio.duration) tm.textContent = fmt(audio.duration * seek.value / 100) + " / " + fmt(audio.duration) }); seek.addEventListener("change", function () { seeking = false; if (audio.duration) audio.currentTime = audio.duration * seek.value / 100 }); loopBtn.addEventListener("click", function () { isLoop = !isLoop; audio.loop = isLoop; loopBtn.textContent = isLoop ? gLoopText() : gLoopOffText(); loopBtn.classList.toggle("active") }) } })();
    // Sakura

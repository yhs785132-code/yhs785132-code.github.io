<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM | 个人博客</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Courier New','Fira Code','Noto Sans SC',monospace,sans-serif;background:#0b0b12;color:#d0d0e0;min-height:100vh;overflow-x:hidden;line-height:1.7}
::selection{background:#00f0ff33;color:#00f0ff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0b0b12}
::-webkit-scrollbar-thumb{background:#00f0ff22;border-radius:3px}
body::before{content:'';position:fixed;top:0;left:0;width:100vw;height:100vh;background-image:linear-gradient(rgba(0,240,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,255,0.03) 1px,transparent 1px);background-size:80px 80px;pointer-events:none;z-index:0}
#particle-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;opacity:0.5}
body::after{content:'';position:fixed;top:0;left:0;width:100vw;height:100vh;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.02) 0px,rgba(0,0,0,0.02) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:9999}
.container{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:40px 24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0 20px;border-bottom:1px solid rgba(0,240,255,0.1);margin-bottom:50px;flex-wrap:wrap;gap:10px}
nav .logo{font-size:1.2rem;font-weight:700;letter-spacing:3px;color:#00f0ff;text-shadow:0 0 12px rgba(0,240,255,0.3)}
nav .logo span{color:#ff00ff}
.nav-right{display:flex;align-items:center;gap:24px}
.nav-right a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;transition:color 0.3s;position:relative}
.nav-right a:hover{color:#00f0ff}
.nav-right a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:#00f0ff;transition:width 0.3s}
.nav-right a:hover::after{width:100%}
.lang-btn{background:rgba(0,240,255,0.06);border:1px solid rgba(0,240,255,0.15);color:#00f0ff88;padding:4px 12px;border-radius:2px;font-family:inherit;font-size:0.7rem;letter-spacing:1px;cursor:pointer;transition:all 0.3s}
.lang-btn:hover{background:rgba(0,240,255,0.12);color:#00f0ff}
.hero{text-align:center;padding:30px 0 40px}
.hero h1{font-size:clamp(2.5rem,8vw,5rem);font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#e0e0ff;display:inline-block;position:relative;text-shadow:0 0 20px rgba(0,240,255,0.3)}
.hero h1::after{content:'';position:absolute;bottom:-4px;left:10%;width:80%;height:2px;background:linear-gradient(90deg,transparent,#00f0ff,#ff00ff,transparent)}
.hero .tagline{font-size:clamp(0.85rem,1.8vw,1.1rem);color:rgba(255,255,255,0.4);margin-top:18px;letter-spacing:2px}
.hero .tagline .c{color:#ff00ff;text-shadow:0 0 8px rgba(255,0,255,0.3)}
.tw-wrap{text-align:center;margin:10px 0 36px;min-height:2.4em}
.tw-wrap .t{font-size:clamp(0.85rem,1.6vw,1rem);color:rgba(0,240,255,0.55);letter-spacing:1px}
.tw-wrap .cursor{display:inline-block;width:2px;height:1em;background:#00f0ff;margin-left:3px;animation:blink 0.8s infinite;vertical-align:text-bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.music-player{margin:40px 0 30px;background:rgba(255,255,255,0.02);border:1px solid rgba(0,240,255,0.08);border-radius:3px;padding:20px 24px}
.music-player .mp-title{font-size:0.7rem;letter-spacing:2px;color:rgba(0,240,255,0.4);text-transform:uppercase;margin-bottom:12px}
.mp-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mp-btn{background:rgba(0,240,255,0.06);border:1px solid rgba(0,240,255,0.15);color:#00f0ff;padding:8px 20px;border-radius:2px;font-family:inherit;font-size:0.8rem;letter-spacing:1px;cursor:pointer;transition:all 0.3s;user-select:none}
.mp-btn:hover{background:rgba(0,240,255,0.12);border-color:#00f0ff44}
.mp-btn.active{background:rgba(255,0,255,0.1);border-color:#ff00ff44;color:#ff00ff}
.mp-status{font-size:0.7rem;color:rgba(255,255,255,0.3);letter-spacing:1px;min-width:70px}
.mp-time{font-size:0.65rem;color:rgba(0,240,255,0.3);font-family:inherit;letter-spacing:1px;min-width:90px;text-align:center}
input[type=range].seek-bar{width:100%;margin:8px 0;height:4px;-webkit-appearance:none;appearance:none;background:rgba(0,240,255,0.1);outline:none;border-radius:2px;cursor:pointer}
input[type=range].seek-bar::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#00f0ff;cursor:pointer;border:1px solid rgba(0,240,255,0.3)}
#splash{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0b0b12;z-index:10000;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;transition:opacity 0.6s}
#splash.hide{opacity:0;pointer-events:none}
#splash .sp-text{font-size:1rem;letter-spacing:6px;text-transform:uppercase;color:#00f0ff;text-shadow:0 0 15px rgba(0,240,255,0.3);animation:pulse 2s infinite}
#splash .sp-sub{font-size:0.6rem;letter-spacing:4px;color:rgba(255,255,255,0.15);margin-top:14px;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.anime-section{margin:40px 0 30px;background:rgba(255,0,255,0.02);border:1px solid rgba(255,0,255,0.08);border-radius:3px;padding:24px;text-align:center}
.anime-section .as-title{font-size:0.7rem;letter-spacing:2px;color:rgba(255,0,255,0.4);text-transform:uppercase;margin-bottom:12px}
.anime-section p{font-size:0.85rem;color:rgba(255,255,255,0.4);margin-bottom:16px}
.anime-btn{display:inline-block;background:rgba(255,0,255,0.08);border:1px solid rgba(255,0,255,0.2);color:#ff00ff88;padding:10px 32px;border-radius:2px;font-family:inherit;font-size:0.85rem;letter-spacing:3px;text-decoration:none;text-transform:uppercase;transition:all 0.3s;cursor:pointer}
.anime-btn:hover{background:rgba(255,0,255,0.15);border-color:#ff00ff;color:#ff00ff;box-shadow:0 0 20px rgba(255,0,255,0.15)}
footer{margin-top:60px;padding:24px 0 16px;border-top:1px solid rgba(0,240,255,0.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:0.7rem;color:rgba(255,255,255,0.2);letter-spacing:1px}
footer a{color:rgba(0,240,255,0.35);text-decoration:none;margin-left:14px;transition:color 0.3s}
footer a:hover{color:#ff00ff88}
@media(max-width:600px){.container{padding:24px 16px}nav{flex-direction:column;gap:12px}}
</style>
</head>
<body>
<div id="splash"><div class="sp-text">▶ ENTER</div><div class="sp-sub">SAM · 2026</div></div>
<canvas id="particle-canvas"></canvas>
<div class="container">
  <nav>
    <div class="logo">SAM<span>_</span>BLOG</div>
    <div class="nav-right">
      <a href="#" data-i18n="nav_home">首页</a>
      <a href="about.html" data-i18n="nav_about">关于</a>
      <a href="anime.html" data-i18n="nav_anime">番剧</a>
      <button class="lang-btn" id="langToggle">EN</button>
    </div>
  </nav>
  <section class="hero">
    <h1>SAM</h1>
    <div class="tagline"><span class="c">✦</span> <span data-i18n="hero_tagline">RESEARCHER · EXPLORER · CODER</span> <span class="c">✦</span></div>
  </section>
  <div class="tw-wrap"><span class="t" id="tw"></span><span class="cursor"></span></div>

  <div class="music-player">
    <div class="mp-title" data-i18n="mp_title">♫ HANS ZIMMER — CORNFIELD CHASE</div>
    <div class="mp-controls">
      <button class="mp-btn" id="mp-play">▶</button>
      <span class="mp-time" id="mp-time">00:00 / 00:00</span>
      <button class="mp-btn" id="mp-loop">🔁</button>
      <span class="mp-status" id="mp-status" data-i18n="mp_ready">■ 就绪</span>
    </div>
    <input type="range" class="seek-bar" id="mp-seek" value="0" max="100">
  </div>

  <div class="anime-section">
    <div class="as-title" data-i18n="anime_section_title">◆ 番剧推荐</div>
    <p data-i18n="anime_section_desc">命运石之门 · Re:Zero · 刀剑神域 · 一拳超人 ……</p>
    <a href="anime.html" class="anime-btn" data-i18n="anime_section_btn">进入番剧世界 ▸</a>
  </div>
  <footer>
    <span>&copy; 2026 SAM</span>
    <div><a href="about.html">About</a><a href="anime.html">Anime</a><a href="#">Contact</a></div>
  </footer>
</div>

<script>
// Splash → autoplay music
!(function(){const splash=document.getElementById('splash');const audio=new Audio();audio.preload='auto';audio.volume=0.4;audio.loop=true;const p=window.location.href.lastIndexOf('/');audio.src=window.location.href.substring(0,p+1)+'Hans Zimmer - Cornfield Chase.mp3';splash.addEventListener('click',async()=>{splash.classList.add('hide');try{await audio.play()}catch(e){}initPlayer()});function initPlayer(){const btn=document.getElementById('mp-play'),loopBtn=document.getElementById('mp-loop');const st=document.getElementById('mp-status'),tm=document.getElementById('mp-time'),seek=document.getElementById('mp-seek');let isPlaying=true,isLoop=true,seeking=false;btn.textContent='⏸';btn.classList.add('active');st.textContent='♫';loopBtn.classList.add('active');loopBtn.textContent='🔁 循环中';audio.loop=true;function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function ut(){if(!audio.duration||!isPlaying||seeking)return;seek.value=(audio.currentTime/audio.duration)*100;tm.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);requestAnimationFrame(ut)}requestAnimationFrame(ut);btn.addEventListener('click',()=>{if(isPlaying){audio.pause();isPlaying=false;btn.textContent='▶';btn.classList.remove('active');st.textContent='■'}else{audio.play();isPlaying=true;btn.textContent='⏸';btn.classList.add('active');st.textContent='♫';requestAnimationFrame(ut)}});seek.addEventListener('input',()=>{seeking=true;if(audio.duration)tm.textContent=fmt(audio.duration*seek.value/100)+' / '+fmt(audio.duration)});seek.addEventListener('change',()=>{seeking=false;if(audio.duration)audio.currentTime=audio.duration*seek.value/100});loopBtn.addEventListener('click',()=>{isLoop=!isLoop;audio.loop=isLoop;loopBtn.textContent=isLoop?'🔁 循环中':'🔁 循环';loopBtn.classList.toggle('active')})}})();
// Particles
!(function(){const c=document.getElementById('particle-canvas'),x=c.getContext('2d');let w,h,p=[],n=80,d=140;function r(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}window.addEventListener('resize',r);r();class P{constructor(){this.R()}R(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-.5)*.5;this.vy=(Math.random()-.5)*.5;this.r=Math.random()*1.8+.3}U(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w)this.vx*=-1;if(this.y<0||this.y>h)this.vy*=-1}D(){x.beginPath();x.arc(this.x,this.y,this.r,0,Math.PI*2);x.fillStyle='rgba(0,240,255,0.3)';x.fill()}}for(let i=0;i<n;i++)p.push(new P);const cs=['rgba(0,240,255,','rgba(255,0,255,','rgba(0,220,180,'];function L(){for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){const dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<d){const a=(1-dist/d)*.2,ci=(i+j)%cs.length;x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.strokeStyle=cs[ci]+a+')';x.lineWidth=.5;x.stroke()}}}let m={x:-999,y:-999};window.addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});window.addEventListener('mouseleave',()=>{m.x=-999;m.y=-999});function M(){for(const q of p){const dx=q.x-m.x,dy=q.y-m.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<d*1.2){const a=(1-dist/(d*1.2))*.3;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(q.x,q.y);x.strokeStyle='rgba(255,0,255,'+a+')';x.lineWidth=.6;x.stroke()}}}function A(){x.clearRect(0,0,w,h);x.shadowBlur=0;for(const q of p){q.U();q.D()}x.shadowBlur=0;L();M();requestAnimationFrame(A)}A()})();
// Typewriter
const twPhrases={zh:['> 系统初始化完成 … 欢迎来到 SAM 的数字空间','> 南京大学 → 北京大学 … 探索永无止境','> "我们都是自己内心的囚徒"','> 兴趣：AI · 量子计算 · 赛博朋克 · 二次元','> SYSTEM READY /// 请随意浏览','> 正在初始化神经接口…','> 信号已获取。认知节点：SAM。','> 南京大学 → 北京大学。','> 年龄：22。状态：追求知识中。','> "宇宙在我们心中。" — C. Sagan','> 系统就绪。// 开始运行。'],en:['> Initializing neural interface...','> Signal acquired. Cognitive node: SAM.','> Nanjing University → Peking University.','> Age: 22. Status: In pursuit of knowledge.','> "The cosmos is within us." — C. Sagan','> SYSTEM READY. // engage.','> System initialization complete... Welcome to SAM\'s digital space.','> NJU → PKU ... endless exploration.','> "We are all just prisoners here, of our own device"','> Interests: AI · Quantum Computing · Cyberpunk · Anime','> SYSTEM READY /// feel free to browse']};
let twIdx=0,twChar=0,twEl=document.getElementById('tw'),twTimer=null;
function restartTypewriter(){if(twTimer){clearTimeout(twTimer);twTimer=null}twIdx=0;twChar=0;twEl.textContent='';setTimeout(typeTw,200)}
function typeTw(){const arr=twPhrases[localStorage.getItem('sam_lang')||'zh'];if(!arr||!arr.length){twTimer=setTimeout(typeTw,500);return}if(twChar<arr[twIdx].length){twEl.textContent+=arr[twIdx][twChar];twChar++;twTimer=setTimeout(typeTw,25+Math.random()*35)}else{twTimer=setTimeout(eraseTw,2000)}}
function eraseTw(){if(twChar>0){twEl.textContent=twEl.textContent.slice(0,-1);twChar--;twTimer=setTimeout(eraseTw,12)}else{const arr=twPhrases[localStorage.getItem('sam_lang')||'zh'];twIdx=(twIdx+1)%arr.length;twTimer=setTimeout(typeTw,500)}}
const i18n={zh:{nav_home:'首页',nav_about:'关于',nav_anime:'番剧',hero_tagline:'RESEARCHER · EXPLORER · CODER',mp_title:'♫ HANS ZIMMER — CORNFIELD CHASE',mp_ready:'■ 就绪',anime_section_title:'◆ 番剧推荐',anime_section_desc:'命运石之门 · Re:Zero · 刀剑神域 · 一拳超人 ……',anime_section_btn:'进入番剧世界 ▸'},en:{nav_home:'Home',nav_about:'About',nav_anime:'Anime',hero_tagline:'RESEARCHER · EXPLORER · CODER',mp_title:'♫ HANS ZIMMER — CORNFIELD CHASE',mp_ready:'■ Ready',anime_section_title:'◆ Anime Favorites',anime_section_desc:'Steins;Gate · Re:Zero · SAO · One Punch Man ……',anime_section_btn:'Enter Anime World ▸'}};
function applyLang(l){localStorage.setItem('sam_lang',l);document.getElementById('langToggle').textContent=l==='zh'?'EN':'中';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(i18n[l]&&i18n[l][k]) el.innerHTML=i18n[l][k]});restartTypewriter()}
const sl=localStorage.getItem('sam_lang')||'zh';document.getElementById('langToggle').textContent=sl==='zh'?'EN':'中';
document.getElementById('langToggle').addEventListener('click',()=>{const c=localStorage.getItem('sam_lang')||'zh';applyLang(c==='zh'?'en':'zh')});setTimeout(()=>applyLang(sl),10);
</script>
</body>
</html>
